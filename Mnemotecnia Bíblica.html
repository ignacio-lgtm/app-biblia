<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnemotecnia Bíblica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        bible: {
                            blue: '#e0f2fe',     // sky-100
                            darkblue: '#0369a1', // sky-700
                            gold: '#d4af37',     // metallic gold
                            goldlight: '#fef3c7',// amber-50
                            text: '#334155',     // slate-700
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for smooth transitions that Tailwind doesn't handle natively as easily */
        body {
            background-color: #f8fafc; /* slate-50 */
            color: #334155;
        }
        
        .breakdown-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out, margin 0.3s ease;
        }
        
        .breakdown-content.open {
            max-height: 800px; /* Arbitrary large max-height for transition to work */
            opacity: 1;
            margin-top: 1rem;
        }

        /* Study Mode Styles */
        .study-mode-active .hide-in-study {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Toggle Switch Custom CSS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #d4af37; /* gold */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #d4af37;
        }
        .toggle-checkbox {
            right: auto;
            left: 0;
            z-index: 1;
            transition: all 0.3s;
        }
        .toggle-label {
            transition: all 0.3s;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans">

    <header class="bg-white shadow-sm border-b border-bible-blue sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl sm:text-3xl font-serif font-bold text-bible-darkblue flex items-center justify-center sm:justify-start gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-bible-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    Mnemotecnia Bíblica
                </h1>
                <p class="text-sm text-gray-500 mt-1">Aprende los libros de la Biblia fácilmente</p>
            </div>

            <!-- Study Mode Toggle -->
            <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-full border border-slate-200 shadow-inner">
                <span class="text-sm font-medium text-slate-600">Modo Estudio</span>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="studyToggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-slate-300 appearance-none cursor-pointer"/>
                    <label for="studyToggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer"></label>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full sm:px-6 lg:px-8">
        
        <!-- Tabs -->
        <div class="flex border-b border-gray-200 mb-8 justify-center sm:justify-start">
            <button id="tab-antiguo" class="tab-btn w-1/2 sm:w-auto py-4 px-1 text-center border-b-2 font-medium text-sm sm:text-base text-bible-darkblue border-bible-darkblue transition-colors" onclick="switchTab('antiguo')">
                Antiguo Testamento
            </button>
            <button id="tab-nuevo" class="tab-btn w-1/2 sm:w-auto py-4 px-1 text-center border-b-2 font-medium text-sm sm:text-base text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 transition-colors sm:ml-8" onclick="switchTab('nuevo')">
                Nuevo Testamento
            </button>
        </div>

        <!-- Content Container -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <!-- Cards will be injected here by JS -->
        </div>

    </main>

    <footer class="bg-white border-t border-gray-200 py-6 mt-auto">
        <div class="text-center text-sm text-gray-500">
            Diseñado para memorización sencilla y elegante.
        </div>
    </footer>

    <script>
        const data = {
            antiguo: [
                {
                    id: 1,
                    title: "1. Pentateuco",
                    books: "Génesis, Éxodo, Levítico, Números, Deuteronomio.",
                    rule: "Génesis exige a Leví números de Deuteronomio.",
                    breakdown: [
                        "<b>Génesis</b> → Génesis",
                        "<b>exige</b> → Éxodo",
                        "<b>Leví</b> → Levítico",
                        "<b>números</b> → Números",
                        "<b>Deuteronomio</b> → Deuteronomio"
                    ]
                },
                {
                    id: 2,
                    title: "2. Históricos",
                    books: "Josué, Jueces, Rut, 1 Samuel, 2 Samuel, 1 Reyes, 2 Reyes, 1 Crónicas, 2 Crónicas, Esdras, Nehemías, Ester.",
                    rule: "Josué juzga a Rut; un Samuel y dos Samuel; un rey y dos reyes; un crónico y dos crónicos; Esdras, Nehemías, Ester.",
                    breakdown: [
                        "<b>Josué</b> → Josué",
                        "<b>juzga</b> → Jueces",
                        "<b>Rut</b> → Rut",
                        "<b>un Samuel</b> → 1 Samuel",
                        "<b>dos Samuel</b> → 2 Samuel",
                        "<b>un rey</b> → 1 Reyes",
                        "<b>dos reyes</b> → 2 Reyes",
                        "<b>un crónico</b> → 1 Crónicas",
                        "<b>dos crónicos</b> → 2 Crónicas",
                        "<b>Esdras, Nehemías, Ester</b> → exactos"
                    ]
                },
                {
                    id: 3,
                    title: "3. Poéticos",
                    books: "Job, Salmos, Proverbios, Eclesiastés, Cantares.",
                    rule: "Job salta proverbialmente; Eclesiastés canta.",
                    breakdown: [
                        "<b>Job</b> → Job",
                        "<b>salta</b> → Salmos",
                        "<b>proverbialmente</b> → Proverbios",
                        "<b>Eclesiastés</b> → Eclesiastés",
                        "<b>canta</b> → Cantares"
                    ]
                },
                {
                    id: 4,
                    title: "4. Profetas Mayores",
                    books: "Isaías, Jeremías, Lamentaciones, Ezequiel, Daniel.",
                    rule: "Isaías y Jeremías lamentan; Ezequiel y Daniel.",
                    breakdown: [
                        "<b>Isaías, Jeremías</b> → exactos",
                        "<b>lamentan</b> → Lamentaciones",
                        "<b>Ezequiel, Daniel</b> → exactos"
                    ]
                },
                {
                    id: 5,
                    title: "5. Profetas Menores",
                    books: "Oseas, Joel, Amós, Abdías, Jonás, Miqueas, Nahúm, Habacuc, Sofonías, Hageo, Zacarías, Malaquías.",
                    rule: "Oseas y Joel, Amós y Abdías, Jonás y Miqueas, Nahúm y Habacuc, Sofonías y Hageo, Zacarías y Malaquías.",
                    breakdown: [
                        "Todos son los nombres exactos, agrupados de dos en dos para mantener el ritmo y facilitar la memorización."
                    ]
                }
            ],
            nuevo: [
                {
                    id: 6,
                    title: "6. Evangelios y Hechos",
                    books: "Mateo, Marcos, Lucas, Juan, Hechos.",
                    rule: "Mateo marca a Lucas; Juan Hechos.",
                    breakdown: [
                        "<b>Mateo</b> → Mateo",
                        "<b>marca</b> → Marcos",
                        "<b>Lucas</b> → Lucas",
                        "<b>Juan</b> → Juan",
                        "<b>Hechos</b> → Hechos"
                    ]
                },
                {
                    id: 7,
                    title: "7. Cartas de Pablo",
                    books: "Romanos, 1 Corintios, 2 Corintios, Gálatas, Efesios, Filipenses, Colosenses, 1 Tesalonicenses, 2 Tesalonicenses, 1 Timoteo, 2 Timoteo, Tito, Filemón.",
                    rule: "Romanos un corintio, dos corintios; Gálatas, Efesios, Filipenses, Colosenses; un tesalonicense, dos tesalonicenses; un Timoteo, dos Timoteo; Tito, Filemón.",
                    breakdown: [
                        "<b>corintio/corintios</b> → Corintios",
                        "<b>tesalonicense/tesalonicenses</b> → Tesalonicenses",
                        "<b>Timoteo</b> → Timoteo",
                        "<b>Tito, Filemón</b> → exactos"
                    ]
                },
                {
                    id: 8,
                    title: "8. Cartas Generales y Apocalipsis",
                    books: "Hebreos, Santiago, 1 Pedro, 2 Pedro, 1 Juan, 2 Juan, 3 Juan, Judas, Apocalipsis.",
                    rule: "Hebreos y Santiago; un Pedro, dos Pedro; un Juan, dos Juan, tres Juan; Judas y Apocalipsis.",
                    breakdown: [
                        "<b>Hebreos, Santiago, Judas, Apocalipsis</b> → exactos",
                        "<b>un/dos Pedro</b> → 1 y 2 Pedro",
                        "<b>un/dos/tres Juan</b> → 1, 2 y 3 Juan"
                    ]
                }
            ]
        };

        const container = document.getElementById('cards-container');
        let currentTab = 'antiguo';

        // Function to create a card HTML string
        function createCard(item) {
            const breakdownItems = item.breakdown.map(b => `<li class="relative pl-4 before:content-['•'] before:absolute before:left-0 before:text-bible-gold">${b}</li>`).join('');
            
            return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col h-full">
                    <div class="p-6 flex-grow flex flex-col">
                        
                        <h2 class="text-xl font-bold text-bible-darkblue mb-3 font-serif">${item.title}</h2>
                        
                        <!-- Books List (Hidden in Study Mode) -->
                        <div class="mb-4 hide-in-study text-sm text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <span class="font-semibold text-slate-700 block mb-1">Libros:</span>
                            ${item.books}
                        </div>

                        <!-- The Rule / Mnemonic -->
                        <div class="bg-bible-goldlight border-l-4 border-bible-gold p-4 rounded-r-xl my-4">
                            <p class="font-serif italic text-lg text-amber-900 leading-relaxed">
                                "${item.rule}"
                            </p>
                        </div>

                        <!-- Breakdown Toggle Button (Hidden in Study Mode) -->
                        <div class="mt-auto pt-4 hide-in-study">
                            <button onclick="toggleBreakdown(${item.id})" class="flex items-center gap-2 text-sm font-semibold text-bible-darkblue hover:text-sky-600 transition-colors w-full focus:outline-none group">
                                <svg id="icon-${item.id}" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-300 transform group-hover:scale-110 text-bible-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                                <span id="text-${item.id}">Mostrar Desglose</span>
                            </button>
                            
                            <!-- Breakdown Content -->
                            <div id="breakdown-${item.id}" class="breakdown-content bg-slate-50 rounded-xl p-4 border border-slate-100">
                                <ul class="space-y-2 text-sm text-slate-700">
                                    ${breakdownItems}
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        // Function to render cards based on active tab
        function renderCards(testament) {
            // Fade out effect
            container.style.opacity = '0';
            
            setTimeout(() => {
                const items = data[testament];
                container.innerHTML = items.map(createCard).join('');
                // Fade back in
                container.style.transition = 'opacity 0.3s ease-in-out';
                container.style.opacity = '1';
            }, 150); // slight delay for visual transition
        }

        // Tab switching logic
        window.switchTab = function(testament) {
            if (currentTab === testament) return;
            currentTab = testament;
            
            const btnAntiguo = document.getElementById('tab-antiguo');
            const btnNuevo = document.getElementById('tab-nuevo');

            // Reset classes
            btnAntiguo.className = "tab-btn w-1/2 sm:w-auto py-4 px-1 text-center border-b-2 font-medium text-sm sm:text-base border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors";
            btnNuevo.className = "tab-btn w-1/2 sm:w-auto py-4 px-1 text-center border-b-2 font-medium text-sm sm:text-base border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors sm:ml-8";

            // Set active classes
            if (testament === 'antiguo') {
                btnAntiguo.classList.add('border-bible-darkblue', 'text-bible-darkblue');
                btnAntiguo.classList.remove('border-transparent', 'text-gray-500');
            } else {
                btnNuevo.classList.add('border-bible-darkblue', 'text-bible-darkblue');
                btnNuevo.classList.remove('border-transparent', 'text-gray-500');
            }

            renderCards(testament);
        }

        // Accordion toggle logic
        window.toggleBreakdown = function(id) {
            const content = document.getElementById(`breakdown-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            const textSpan = document.getElementById(`text-${id}`);
            
            if (content.classList.contains('open')) {
                // Close it
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
                textSpan.innerText = 'Mostrar Desglose';
            } else {
                // Open it
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
                textSpan.innerText = 'Ocultar Desglose';
            }
        }

        // Study Mode logic
        const studyToggle = document.getElementById('studyToggle');
        studyToggle.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('study-mode-active');
                // Close all open accordions when entering study mode to prevent weird state
                document.querySelectorAll('.breakdown-content.open').forEach(el => {
                    const id = el.id.split('-')[1];
                    toggleBreakdown(id); 
                });
            } else {
                document.body.classList.remove('study-mode-active');
            }
        });

        // Initial render
        renderCards('antiguo');
    </script>
</body>
</html>
